<script>
// ============================================================
// SECOND LIFE v3 — PSYCHOLOGY ENGINE (Construct-Driven)
// Built on Big Five + HEXACO Honesty-Humility, since HEXACO's H-factor is
// what actually produces derived labels like "Greedy" (low H) as a
// legitimate psychometric construct rather than an arbitrary tag.
// ============================================================

// Six clusters. Each raw trait belongs to exactly one cluster so we can
// track "confidence" (how many scenarios have given signal) per cluster,
// which drives adaptive selection below.
const CLUSTERS = {
  OPENNESS:        { traits: ['CRE','INT','CUR'], label: 'Keterbukaan' },
  CONSCIENTIOUS:   { traits: ['CON','PLN','REL'], label: 'Kehati-hatian' },
  EXTRAVERSION:    { traits: ['SOC','CHA','ASR'], label: 'Ekstraversi' },
  AGREEABLENESS:   { traits: ['COMP','TRU','COOP'], label: 'Keramahan' },
  STABILITY:       { traits: ['RES','IMP','ANX'], label: 'Stabilitas Emosi' },
  HONESTY_HUMIL:   { traits: ['HON','GRD','FAIR'], label: 'Kejujuran-Kerendahan Hati' },
  // kept from v2 as "applied" traits derived FROM the clusters, not raw
  // inputs themselves — these feed class computation directly
  APPLIED:         { traits: ['RISK','DOM','JUST','UTIL','SELF','PER','LOG','ADP','LOY','AMB','STR','AGI','VIT'], label: 'Terapan' },
};
const ALL_TRAIT_KEYS = Object.values(CLUSTERS).flatMap(c => c.traits);

const TRAIT_LABELS = {
  CRE:'Kreativitas', INT:'Kecerdasan', CUR:'Rasa Ingin Tahu',
  CON:'Disiplin', PLN:'Perencanaan', REL:'Keandalan',
  SOC:'Kepekaan Sosial', CHA:'Karisma', ASR:'Asertivitas',
  COMP:'Kasih Sayang', TRU:'Kecenderungan Percaya', COOP:'Kooperatif',
  RES:'Resiliensi', IMP:'Impulsivitas', ANX:'Kecemasan',
  HON:'Kejujuran', GRD:'Ketamakan', FAIR:'Rasa Keadilan',
  RISK:'Toleransi Risiko', DOM:'Dominasi', JUST:'Orientasi Keadilan',
  UTIL:'Pragmatisme', SELF:'Mempertahankan Diri', PER:'Persepsi',
  LOG:'Logika', ADP:'Adaptabilitas', LOY:'Loyalitas', AMB:'Ambisi',
  STR:'Kekuatan', AGI:'Ketangkasan', VIT:'Vitalitas',
};

function newTraitState() {
  const t = {};
  ALL_TRAIT_KEYS.forEach(k => t[k] = 50);
  return t;
}

// Confidence tracker: how much signal we've gathered per cluster so far.
// Starts at 0, each scenario that measures a cluster adds to it. This is
// the basis for adaptive scenario selection (see selectNextScenario below).
function newConfidenceState() {
  const c = {};
  Object.keys(CLUSTERS).forEach(k => c[k] = 0);
  return c;
}

// Contradiction tracker: for a cluster, if answers have been pulling the
// trait both up AND down across different scenarios (not just settling
// in one direction), that's a genuine psychometric signal worth another
// look — real SJT research treats inconsistency as informative, not noise.
function newContradictionState() {
  const c = {};
  Object.keys(CLUSTERS).forEach(k => c[k] = { ups: 0, downs: 0 });
  return c;
}

// Given a scenario's declared `measures` (list of cluster keys) and the
// direction of the delta it would apply, update confidence + contradiction.
function updateConfidence(confidence, contradiction, measures, delta) {
  measures.forEach(clusterKey => {
    confidence[clusterKey] = (confidence[clusterKey] || 0) + 1;
    const clusterTraits = CLUSTERS[clusterKey].traits;
    let netDirection = 0;
    clusterTraits.forEach(t => { if (delta[t]) netDirection += delta[t]; });
    if (netDirection > 0) contradiction[clusterKey].ups++;
    else if (netDirection < 0) contradiction[clusterKey].downs++;
  });
}

// Derived personality labels — the "Greedy" request maps directly to low
// Honesty-Humility (HEXACO's actual construct for this), not an arbitrary
// flag. Each label requires the cluster to have enough confidence (signal)
// before it's allowed to surface, mirroring the reliability requirement in
// real psychometrics: you don't label someone off one data point.
const DERIVED_LABELS = [
  { id:'greedy', minConfidence:{HONESTY_HUMIL:3}, cond:t => t.GRD > 68 && t.FAIR < 45,
    label:'Tamak', desc:'Pola pilihanmu berulang kali memprioritaskan keuntungan pribadi bahkan ketika itu mengorbankan keadilan terhadap orang lain.' },
  { id:'principled', minConfidence:{HONESTY_HUMIL:3}, cond:t => t.HON > 65 && t.FAIR > 60,
    label:'Berprinsip', desc:'Kejujuran dan rasa keadilanmu tetap konsisten bahkan ketika situasi memberimu jalan keluar yang lebih mudah.' },
  { id:'ruthless_pragmatist', minConfidence:{APPLIED:3, HONESTY_HUMIL:2}, cond:t => t.UTIL > 65 && t.COMP < 40,
    label:'Pragmatis Tanpa Ampun', desc:'Kamu berulang kali memilih hasil yang efisien di atas pertimbangan perasaan siapa pun yang terlibat.' },
  { id:'anxious_overthinker', minConfidence:{STABILITY:3}, cond:t => t.ANX > 65 && t.RES < 45,
    label:'Pencemas', desc:'Momen-momen krisis cenderung membekas lama dalam pikiranmu, bahkan setelah situasinya sendiri sudah berlalu.' },
  { id:'reckless', minConfidence:{STABILITY:3, APPLIED:2}, cond:t => t.IMP > 65 && t.RISK > 60,
    label:'Sembrono', desc:'Kamu bertindak dulu, memikirkan akibatnya belakangan — sebuah pola yang berulang di banyak situasi berbeda.' },
  { id:'guarded', minConfidence:{AGREEABLENESS:3}, cond:t => t.TRU < 35 && t.COOP < 40,
    label:'Waspada', desc:'Kepercayaanmu terhadap orang lain harus diperoleh secara perlahan — kamu jarang memberikannya di muka.' },
  { id:'devoted', minConfidence:{AGREEABLENESS:3, APPLIED:2}, cond:t => t.LOY > 68 && t.COOP > 60,
    label:'Setia', desc:'Begitu kepercayaanmu diberikan, ia jarang goyah — bahkan ketika situasi memberimu alasan untuk ragu.' },
];
function computeDerivedLabels(traits, confidence) {
  return DERIVED_LABELS.filter(l => {
    const confMet = Object.entries(l.minConfidence).every(([k,v]) => (confidence[k]||0) >= v);
    return confMet && l.cond(traits);
  });
}

// ============================================================
// ADAPTIVE SCENARIO SELECTION (Computerized-Adaptive-Testing inspired)
// Given the scenario bank, current confidence, and current contradiction
// state, pick the single best next scenario to serve. This is what turns
// "hundreds of scenarios" into "a well-chosen 40" instead of a random draw.
// ============================================================
function scenarioInformationValue(scenario, confidence, contradiction) {
  // base value: how under-measured are this scenario's target clusters?
  let value = 0;
  (scenario.measures || []).forEach(clusterKey => {
    const conf = confidence[clusterKey] || 0;
    // information gain shrinks as confidence grows — classic CAT logic:
    // early scenarios on a cluster are worth more than the 10th one
    value += Math.max(0, 10 - conf * 1.5);
    // bonus: if this cluster shows contradictory signal (both ups and
    // downs recorded), a fresh scenario measuring it is worth MORE — it
    // can help resolve whether the trait is genuinely mixed or noisy
    const c = contradiction[clusterKey];
    if (c && c.ups > 0 && c.downs > 0) value += 6;
  });
  return value;
}

// Filters the bank by structural eligibility (companion presence/archetype,
// phase, solo/duo requirement, and "already used" scenarios), then scores
// remaining candidates by information value, with a little randomness so
// two playthroughs with similar trait paths don't feel identical.
function selectNextScenario(bank, usedIds, phase, companion, confidence, contradiction) {
  const candidates = bank.filter(s => {
    if (usedIds.has(s.id)) return false;
    if (s.phase !== phase) return false;
    if (s.requiresCompanion && !companion) return false;
    if (s.requiresSolo && companion) return false;
    if (s.companionArchetype && (!companion || companion.archetype !== s.companionArchetype)) return false;
    return true;
  });
  if (candidates.length === 0) return null;
  const scored = candidates.map(s => ({
    s,
    v: scenarioInformationValue(s, confidence, contradiction) + Math.random() * 3,
  }));
  scored.sort((a,b) => b.v - a.v);
  return scored[0].s;
}

// Decides whether to stop early (all clusters confidently measured) or
// continue up to the configured max. Mirrors CAT stopping rules.
function shouldStopAssessment(confidence, questionsAsked, minQuestions, maxQuestions) {
  if (questionsAsked >= maxQuestions) return true;
  if (questionsAsked < minQuestions) return false;
  const allConfident = Object.values(confidence).every(c => c >= 4);
  return allConfident;
}
// ============================================================
// COMPANION SYSTEM v3 — fewer archetypes, each structurally deep.
// Each companion has: personality (RPG-lite, 6 stats per user's request),
// a value-anchor (what they silently judge the player against — already
// partially built in v2, now drives SCENARIO GATING not just end-event risk),
// and reactive lines that fire inline when the player's choice conflicts
// or aligns with what this companion would do.
// ============================================================

const COMPANIONS = [
  {
    id:'niggel', name:'Niggel', archetype:'guardian',
    stats: { STR:78, AGI:55, VIT:70, INT:40, SOC:50, LCK:45 },
    nicknameTolerance: 30,
    desc: "Besar, pendiam, dan sudah lama berhenti percaya bahwa dunia ini adil. Dia tidak butuh alasan rumit untuk melindungi orang — dia hanya melakukannya.",

    reactions: {
      cruelty: "Niggel tidak bicara. Dia hanya menatapmu lama, lalu berjalan menjauh beberapa langkah — cukup untuk membuatmu sadar dia tidak setuju.",
      kindness: "Niggel mengangguk kecil. Itu saja. Tapi dari dia, itu banyak.",
      cowardice: "\"Kita bisa lari,\" katanya pelan, tanpa nada menghakimi. \"Tidak semua pertarungan harus dimenangkan hari ini.\"",
    },
  },
  {
    id:'parel', name:'Parel', archetype:'strategist',
    stats: { STR:35, AGI:50, VIT:45, INT:85, SOC:60, LCK:50 },
    nicknameTolerance: 55,
    desc: "Cepat berpikir, lebih cepat bicara, dan hampir selalu punya tiga rencana cadangan yang tidak kamu tahu keberadaannya sampai dibutuhkan.",
    valueAnchor: { trait:'UTIL', threshold:80, direction:'above' },
    reactions: {

      excessive_pragmatism: "Parel diam sejenak. \"Aku pragmatis. Tapi bahkan aku punya batas, dan kamu baru saja mendekatinya.\"",
    },
  },
  {
    id:'bayu', name:'Bayu', archetype:'idealist',
    stats: { STR:42, AGI:60, VIT:50, INT:55, SOC:75, LCK:55 },
    nicknameTolerance: 70,
    desc: "Masih percaya dunia ini bisa jadi lebih baik, meski sudah cukup lama di sini untuk tahu itu tidak selalu benar. Keras kepala soal itu.",

    desc: "Tidak banyak menjelaskan masa lalunya, dan tidak banyak menuntut penjelasan darimu juga. Santai sampai titik yang kadang terasa mencurigakan.",

    valueAnchor: null,

  {

    valueAnchor: { trait:'UTIL', threshold:80, direction:'above' },

const RELATIONSHIP_ARCHETYPE_LABEL = {
  guardian: 'Sang Pelindung', strategist: 'Sang Perencana', idealist: 'Sang Idealis', drifter: 'Si Pengembara',
};

const COMPANION_WEIGHTS = {
  kindTrust: { niggel:3, bayu:2, parel:1, dodo:1, zen:1, dio:1 },
  kindStrong: { niggel:3, dodo:2, zen:2, parel:1, bayu:1, dio:1 },
  kindSmart: { parel:3, dio:3, bayu:1, niggel:1, dodo:1, zen:1 },
  kindFunny: { dodo:3, zen:3, bayu:2, parel:1, niggel:1, dio:1 },

const STARTING_BOND = { kindTrust:30, kindStrong:22, kindSmart:24, kindFunny:28, kindUnderstand:26, kindDontCare:12 };

const BOND_STAGES = [
  { min:0, label:'Orang Asing' }, { min:15, label:'Kenalan' }, { min:35, label:'Rekan Seperjalanan' },

// ============================================================
// STRUCTURAL COMPANION GATING
// checkCompanionApproval: given a companion's valueAnchor and the player's
// CURRENT traits, determine if this companion would refuse/react to a
// scenario branch tagged with a given "moral flavor" tag.
// ============================================================
function checkCompanionValueBreach(companion, traits) {
  if (!companion || !companion.valueAnchor) return false;
  const { trait, threshold, direction } = companion.valueAnchor;
  const val = traits[trait];
  if (val === undefined) return false;
  return direction === 'below' ? val < threshold : val > threshold;
}

function companionReactionFor(companion, tag) {
  if (!companion || !companion.reactions) return null;
  return companion.reactions[tag] || null;
}

function pickLifestageScenarios(count) {
  const childhood = LIFESTAGE_SCENARIOS.filter(s => s.lifeStage === 'childhood');
  const adolescence = LIFESTAGE_SCENARIOS.filter(s => s.lifeStage === 'adolescence');
  function shuffle(arr) {
    const out = [...arr];
    for (let i = out.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }
    return out;
  }
  const halfCount = Math.ceil(count/2);
  return [...shuffle(childhood).slice(0, halfCount), ...shuffle(adolescence).slice(0, count - halfCount)];
}

  return (choice.classAffinityBoost && choice.classAffinityBoost[familyId]) || 0;
}

function computeClass(traits) {
  let best=null, bestScore=-Infinity;
  CLASS_FAMILIES.forEach(c=>{ const s=c.match(traits); if(s>bestScore){bestScore=s;best=c;} });
  const evolutions = CLASS_EVOLUTIONS[best.id] || [];
  const matched = evolutions.filter(e=>e.cond(traits));
  const evolution = matched.length ? matched[0] : null;
  const almostReached = evolutions.filter(e => e !== evolution).slice(0,2);
  const sorted = CLASS_FAMILIES.map(c=>({c,s:c.match(traits)})).sort((a,b)=>b.s-a.s);
  const secondary = sorted[1]?.c;
  return { primary:best, evolution, secondary, almostReached, affinity: Math.min(97, Math.round(60+(bestScore/100)*8)) };
}

// full list for the settings "class database" viewer
function allClassPaths() {
  const paths = [];
  CLASS_FAMILIES.forEach(fam => {
    const evos = CLASS_EVOLUTIONS[fam.id] || [];
    if (evos.length === 0) paths.push({ family: fam.name, evolution: null });
    evos.forEach(e => paths.push({ family: fam.name, evolution: e.name }));
  });
  return paths;
}

// ============================================================
function rollDice(sides=20) { return Math.floor(Math.random() * sides) + 1; }
function rollCheck(statValue, target, sides=20, assistBonus=0) {
  const roll = rollDice(sides);
  const total = statValue + assistBonus + roll;
  const margin = total - target;
  let outcome;
  if (roll === sides) outcome = 'crit_win';
  else if (roll === 1 && margin < 0) outcome = 'crit_lose';
  else if (margin >= 15) outcome = 'crit_win';
  else if (margin >= 0) outcome = 'win';
  else if (margin >= -8) outcome = 'close';
  else outcome = 'lose';
  return { roll, statValue, assistBonus, total, target, margin, outcome };
}
function autoResolveCheck(statValue, target, sides=20, assistBonus=0) {
  const effectiveStat = statValue + assistBonus;
  if (effectiveStat + 1 >= target) return { outcome: 'crit_win', auto: true, statValue, assistBonus, total: effectiveStat, target };
  if (effectiveStat + sides < target - 10) return { outcome: 'crit_lose', auto: true, statValue, assistBonus, total: effectiveStat, target };
  return null;
}
function companionAssistBonus(companion, bond, statKey, situationAllowsHelp) {
  if (!companion || !situationAllowsHelp) return 0;
  if (typeof state !== 'undefined' && state.companionStatus && state.companionStatus !== 'with_you') return 0;
  const relevantStat = companion.stats[statKey];
  if (relevantStat === undefined) return bond >= 35 ? 1 : 0;
  const bondFactor = bond >= 75 ? 1 : bond >= 35 ? 0.6 : 0.3;
  return Math.round((relevantStat / 100) * 5 * bondFactor);
}

function computeLifespan(traits, hasCompanion) {
  let base = 45;
  base += (traits.RES-50)*0.25; base += (traits.CON-50)*0.15; base += (traits.SELF-50)*0.1;
  base -= Math.max(0,traits.RISK-65)*0.2; base -= Math.max(0,traits.IMP-65)*0.1;
  if (hasCompanion) base += 3;
  base += (Math.random()*14-7);
  return Math.max(19, Math.round(base));
}
function computeGoalProgress(traits, goalId) {
  const goal = GOALS.find(g=>g.id===goalId);
  if (!goal) return 50;
  return Math.round(Math.min(96, Math.max(20, goal.match(traits) + (Math.random()*10-5))));
}
function computeFamilyOutcome(traits, companion, bond, lifespan) {
  const socialPull = (traits.SOC + traits.COMP) / 2;
  let partnered = false, partnerIsCompanion = false;
  if (companion && bond >= 75) {
    partnerIsCompanion = Math.random() < 0.55;
    partnered = partnerIsCompanion || Math.random() < (socialPull/140);
  } else {
    partnered = Math.random() < (socialPull/160);
  }
  let children = 0;
  if (partnered && lifespan > 26) {
    const chances = Math.min(3, Math.floor((lifespan-24)/14));
    for (let i=0;i<chances;i++) if (Math.random() < 0.6) children++;
  }
  let grandchildren = 0;
  if (children > 0 && lifespan > 58) grandchildren = Math.round(children * (Math.random()*2.2));
  return { partnered, partnerIsCompanion, children, grandchildren };
}

  maxQuestions: 35,
  usedScenarioIds: new Set(),
  activeScenario: null,
  chainIndex: 0,
  questionsAsked: 0,
  goal: null,
  objectives: [],
  lifeEvents: [],
  eventIndex: 0,
  eventLog: [],
  lastDiceResult: null,
  history: [],
  derivedLabels: [],
  // lifestage: childhood/adolescence scenarios run before the main assessment
  lifestageQueue: [],
  lifestageIndex: 0,
  // hard choice tracking
  hardChoicesUsed: new Set(),
  pendingAftermath: null, // { text, delayMs } — shown on a later screen transition
  usedHardChoiceIds: new Set(),
  gameEndedEarly: false,
  earlyEndingText: null,
  pendingHardChoice: null,
  pendingHardChoiceResult: null,
};

// ============================================================
// TOAST NOTIFICATIONS (unchanged, still solid)
// ============================================================
function showToast(text, positive) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (positive === true ? 'positive' : positive === false ? 'negative' : '');
  el.textContent = text;
  container.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}
function toastForDelta(delta) {
  const entries = Object.entries(delta || {});
  entries.forEach(([k, v], i) => {
    setTimeout(() => {
      const label = TRAIT_LABELS[k] || k;
      const sign = v > 0 ? '+' : '';
      showToast(`${label} ${sign}${v}`, v > 0);
    }, i * 160);
  });
}
function toastBond(delta, name) {
  if (!delta) return;
  const sign = delta > 0 ? '+' : '';
  showToast(`Ikatan dengan ${name} ${sign}${delta}`, delta > 0);
}

// ============================================================
// CORE STATE MUTATIONS
// ============================================================
function applyDelta(delta, measures) {
  if (!delta) return;
  Object.entries(delta).forEach(([k, v]) => {
    if (state.traits[k] === undefined) state.traits[k] = 50;
    state.traits[k] = Math.max(0, Math.min(100, state.traits[k] + v));
  });
  if (measures) updateConfidence(state.confidence, state.contradiction, measures, delta);
  toastForDelta(delta);
}
function applyBondDelta(delta) {
  if (!delta || !state.companion) return;
  state.bond = Math.max(0, Math.min(100, state.bond + delta));
  toastBond(delta, state.nickname || state.companion.name);
}

function goTo(screen) {
  state.screen = screen;
  render();
  if (typeof window !== 'undefined') window.scrollTo(0, 0);
}

// ============================================================
// COMPANION ROLL
// ============================================================
function rollCompanion() {
  if (state.kindChoice === 'kindAlone') { state.companion = null; return; }
  const weights = COMPANION_WEIGHTS[state.kindChoice] || {};
  const pool = [];
  COMPANIONS.forEach(c => {
    const w = weights[c.id] || 1;
    for (let i = 0; i < w; i++) pool.push(c);
  });
  state.companion = pool[Math.floor(Math.random() * pool.length)];
  state.bond = STARTING_BOND[state.kindChoice] || 15;
}

// ============================================================
// ADAPTIVE ASSESSMENT FLOW
// ============================================================
function currentPhaseForProgress() {
  const ratio = state.questionsAsked / state.maxQuestions;
  if (ratio < 0.35) return 'early';
  if (ratio < 0.75) return 'mid';
  return 'late';
}

function pickNextScenario() {
  const phase = currentPhaseForProgress();
  let scenario = selectNextScenario(FULL_SCENARIO_BANK, state.usedScenarioIds, phase, state.companion, state.confidence, state.contradiction);
  if (!scenario) {
    // fallback: try any phase if the current one is exhausted
    for (const p of ['early','mid','late']) {
      scenario = selectNextScenario(FULL_SCENARIO_BANK, state.usedScenarioIds, p, state.companion, state.confidence, state.contradiction);
      if (scenario) break;
    }
  }
  return scenario;
}

function startAssessment() {
  state.lifestageQueue = pickLifestageScenarios(6);
  state.lifestageIndex = 0;
  state.chainIndex = 0;
  goTo('lifestage');
}

function getCurrentLifestageNode() {
  const s = state.lifestageQueue[state.lifestageIndex];
  if (!s) return null;
  return { text: s.text, choices: s.choices };
}

function answerLifestage(choiceIdx) {
  const s = state.lifestageQueue[state.lifestageIndex];
  const choice = s.choices[choiceIdx];
  applyDelta(choice.d, s.measures);
  state.lifestageIndex++;
  if (state.lifestageIndex >= state.lifestageQueue.length) {
    beginMainAssessment();
  } else {
    render();
  }
}

function beginMainAssessment() {
  state.usedScenarioIds = new Set();
  state.questionsAsked = 0;
  state.chainIndex = 0;
  state.activeScenario = pickNextScenario();
  goTo('assessment');
}

function interpolateCompanionName(text) {
  if (!text) return text;
  const name = state.companion ? (state.nickname || state.companion.name) : '';
  return text.replace(/\{companion\}/g, name);
}

function getCurrentNode() {
  const s = state.activeScenario;
  if (!s) return null;
  if (!s.chain) return { text: interpolateCompanionName(s.text), choices: s.choices, dice: s.dice, timed: s.timed, outcomes: s.outcomes, companionReactionTag: s.companionReactionTag };
  const node = s.chain[state.chainIndex];
  return { text: interpolateCompanionName(node.text || s.text), choices: node.choices, dice: node.dice, timed: node.timed };
}

function answerScenario(choiceIdx, node) {
  const choice = node.choices[choiceIdx];
  applyDelta(choice.d, state.activeScenario.measures);

  // companion structural reaction: fires inline if this choice/scenario is
  // tagged and the companion has a matching reaction line
  const tag = choice.companionReactionTag || node.companionReactionTag;
  if (tag && state.companion) {
    const reaction = companionReactionFor(state.companion, tag);
    if (reaction) {
      setTimeout(() => showToast(`💬 ${reaction}`, null), 400);
    }
  }

  // chained scenario: move to next node without leaving this scenario
  if (state.activeScenario.chain && choice.next !== undefined && choice.next !== null) {
    state.chainIndex = choice.next;
    render();
    return;
  }

  finishScenario();
}

function finishScenario() {
  state.usedScenarioIds.add(state.activeScenario.id);
  state.questionsAsked++;
  state.chainIndex = 0;

  // Hard Choice trigger points: rare, specific moments, not every question.
  // Bridge dilemma fires once near the midpoint; fumie-style fires late.
  const midpoint = Math.floor(state.maxQuestions * 0.45);
  const lateTrigger = Math.floor(state.maxQuestions * 0.85);
  if (state.questionsAsked === midpoint && !state.usedHardChoiceIds.has('hc_bridge')) {
    state.pendingHardChoice = HARD_CHOICES.find(h=>h.id==='hc_bridge'); goTo('hard-choice-intro'); return;
  }
  if (state.questionsAsked === lateTrigger && !state.usedHardChoiceIds.has('hc_fumie')) {
    state.pendingHardChoice = HARD_CHOICES.find(h=>h.id==='hc_fumie'); goTo('hard-choice-intro'); return;
  }

  if (shouldStopAssessment(state.confidence, state.questionsAsked, state.minQuestions, state.maxQuestions)) {
    state.derivedLabels = computeDerivedLabels(state.traits, state.confidence);
    selectGoal();
    goTo('character-sheet');
    return;
  }

  const next = pickNextScenario();
  if (!next) {
    // bank exhausted before reaching configured question count — stop gracefully
    state.derivedLabels = computeDerivedLabels(state.traits, state.confidence);
    selectGoal();
    goTo('character-sheet');
    return;
  }
  state.activeScenario = next;
  render();
}

// ============================================================
// GOAL SELECTION
// ============================================================
function selectGoal() {
  const scored = GOALS.map(g => ({ g, s: g.match(state.traits) + (Math.random()*10-5) }))
    .sort((a,b)=>b.s-a.s);
  state.goal = scored[0].g;
  state.objectives = state.goal.objectives.map(text => ({ text, status: 'pending' }));
}

// ============================================================
// RESET
// ============================================================
function resetGame() {
  state.screen = 'landing';
  state.name = '';
  state.gender = null;
  state.wantChoice = null;
  state.kindChoice = null;
  state.companion = null;
  state.companionStatus = 'with_you';
  state.companionStatusReason = null;
  state.nickname = null;
  state.bond = 0;
  state.traits = newTraitState();
  state.confidence = newConfidenceState();
  state.contradiction = newContradictionState();
  state.mental = { hope:65, anx:20 };
  state.usedScenarioIds = new Set();
  state.activeScenario = null;
  state.chainIndex = 0;
  state.questionsAsked = 0;
  state.goal = null;
  state.objectives = [];
  state.lifeEvents = [];
  state.eventIndex = 0;
  state.eventLog = [];
  state.lastDiceResult = null;
  state.history = [];
  state.derivedLabels = [];
  state.lifestageQueue = [];
  state.lifestageIndex = 0;
  state.usedHardChoiceIds = new Set();
  state.pendingAftermath = null;
  state.pendingHardChoice = null;
  state.pendingHardChoiceResult = null;
  state.gameEndedEarly = false;
  state.earlyEndingText = null;
  goTo('landing');
}

// ============================================================
// HARD CHOICE RESOLUTION
// ============================================================
function selectHardChoiceOption(optionIdx) {
  const hc = state.pendingHardChoice;
  const choice = hc.choices[optionIdx];
  const classBonus = hardChoiceClassBonus(choice, state.traits);

  if (choice.diceTarget === null) {
    // certain-consequence path — no dice, the weight is entirely moral
    applyImmediateHardChoiceResult(choice, choice.immediateText, choice.d);
    return;
  }

  const statVal = state.traits[choice.diceStat] || 50;
  const result = rollCheck(statVal, choice.diceTarget, 20, classBonus);
  state.pendingHardChoiceResult = { choice, result, classBonus };
  goTo('hard-choice-dice');
}

function resolveHardChoiceDice() {
  const { choice, result } = state.pendingHardChoiceResult;
  if (choice.outcomesOnDice) {
    const outcome = choice.outcomesOnDice[result.outcome] || choice.outcomesOnDice['lose'];
    applyImmediateHardChoiceResult(choice, outcome.text, outcome.d);
  } else {
    applyImmediateHardChoiceResult(choice, choice.immediateText, choice.d);
  }
}

function applyImmediateHardChoiceResult(choice, text, delta) {
  const hc = state.pendingHardChoice;
  applyDelta(delta, []);
  state.usedHardChoiceIds.add(hc.id);
  state.history.push({ age: state.questionsAsked, title: hc.title, narrative: text, mentalSnapshot: { ...state.mental } });
  state.eventLog.push({ title: hc.title, text });

  if (choice.aftermathDelay && choice.aftermath) {
    state.pendingAftermath = { title: hc.title, text: choice.aftermath };
  }
  state.pendingHardChoice = null;
  state.pendingHardChoiceResult = null;
  goTo('hard-choice-result');
}

function continueAfterHardChoice() {
  if (state.pendingAftermath) {
    goTo('hard-choice-aftermath');
    return;
  }
  proceedToNextAfterHardChoice();
}

function acknowledgeAftermath() {
  state.pendingAftermath = null;
  proceedToNextAfterHardChoice();
}

function proceedToNextAfterHardChoice() {
  if (shouldStopAssessment(state.confidence, state.questionsAsked, state.minQuestions, state.maxQuestions)) {
    state.derivedLabels = computeDerivedLabels(state.traits, state.confidence);
    selectGoal();
    goTo('character-sheet');
    return;
  }
  const next = pickNextScenario();
  if (!next) {
    state.derivedLabels = computeDerivedLabels(state.traits, state.confidence);
    selectGoal();
    goTo('character-sheet');
    return;
  }
  state.activeScenario = next;
  goTo('assessment');
}

  const preset = NICKNAME_PRESETS.find(p => p.id === presetId);
  const mod = preset.affinityMod(state.companion.nicknameTolerance);
  state.nickname = preset.label(state.companion.name);
  state.bond = Math.max(0, Math.min(100, state.bond + mod));
  const c = state.companion;
  let reaction;
  if (mod >= 5) reaction = `${c.name} tersenyum mendengarnya — panggilan itu terasa pas.`;
  else if (mod > 0) reaction = `${c.name} tidak keberatan.`;
  else if (mod === 0) reaction = `${c.name} tidak bereaksi khusus terhadap itu.`;
  else if (mod > -8) reaction = `${c.name} mengangkat alis, sedikit canggung, tapi membiarkannya.`;
  else reaction = `${c.name} terlihat jelas tidak nyaman. "...bisa kita bicarakan nama panggilan lain?"`;
  showToast(`Ikatan awal ${mod>=0?'+':''}${mod}`, mod >= 0);
  setTimeout(() => { alert(reaction); goTo('assessment-intro'); }, 300);
}

let pendingDiceResult = null;
let timerInterval = null;
let timerValue = 15;

function renderAssessment() {
  const node = getCurrentNode();
  if (!node) { finishScenario(); return renderAssessment(); }
  const progress = Math.min(100, (state.questionsAsked / state.maxQuestions) * 100);

  if (node.dice) return renderDiceQuestion(node, progress);

  return `

    <div style="margin-bottom:20px;">
      <div class="row-between" style="margin-bottom:6px;">

      </div>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${progress}%"></div></div>
    </div>

function renderTimer() {
  timerValue = 15;
  return `<div style="text-align:center;margin-bottom:14px;">
    <span id="timerBadge" style="font-size:10.5px;color:var(--danger);letter-spacing:1px;border:1px solid rgba(232,93,93,0.4);border-radius:6px;padding:3px 10px;">Keputusan cepat · ${timerValue}d</span>
  </div>`;
}
function startTimerIfNeeded() {
  clearInterval(timerInterval);
  const node = getCurrentNode();
  if (node && node.timed && !node.dice) {
    timerValue = 15;
    timerInterval = setInterval(() => {
      timerValue--;
      const badge = document.getElementById('timerBadge');
      if (badge) badge.textContent = `Keputusan cepat · ${timerValue}d`;
      if (timerValue <= 0) { clearInterval(timerInterval); handleScenarioAnswer(Math.floor(Math.random()*node.choices.length)); }
    }, 1000);
  }
}

function handleScenarioAnswer(choiceIdx) {
  clearInterval(timerInterval);
  const node = getCurrentNode();
  answerScenario(choiceIdx, node);
  startTimerIfNeeded();
}

function renderDiceQuestion(node, progress) {
  const result = pendingDiceResult;
  const dice = node.dice;
  const statVal = state.traits[dice.stat] || 50;
  const assistAllowed = !!dice.allowsCompanionHelp;
  const assistBonus = companionAssistBonus(state.companion, state.bond, dice.stat, assistAllowed);
  const auto = !result ? autoResolveCheck(statVal, dice.target, 20, assistBonus) : null;

  const assistNote = state.companion && assistAllowed
    ? `<p class="small-note" style="margin-top:6px;">${state.nickname||state.companion.name} bisa membantu di sini${assistBonus>0?` (+${assistBonus})`:''}.</p>`
    : (state.companion ? `<p class="small-note" style="margin-top:6px;">Ini harus kamu hadapi sendiri.</p>` : '');

  if (auto) {
    return `
    ${headerBar(true, false)}
    <div class="screen">
      <div style="margin-bottom:20px;"><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${progress}%"></div></div></div>
      <p style="font-size:15.5px;line-height:1.7;margin-bottom:16px;">${node.text}</p>
      <div class="panel" style="text-align:center;">
        <p class="small-note" style="margin-bottom:10px;">${TRAIT_LABELS[dice.stat]||dice.stat} kamu (${statVal}${assistBonus>0?` +${assistBonus}`:''}) jelas ${auto.outcome==='crit_win'?'jauh melampaui':'jauh di bawah'} yang dibutuhkan (target ${dice.target}). Tidak perlu dadu.</p>
        <p class="roll-outcome ${OUTCOME_LABEL[auto.outcome].class}">${OUTCOME_LABEL[auto.outcome].text}</p>
        ${assistNote}
      </div>
      <button class="btn-primary" onclick="pendingDiceResult={outcome:'${auto.outcome}',statValue:${statVal},assistBonus:${assistBonus},total:${auto.total},target:${dice.target},roll:null}; resolveDiceScenario();">Lanjut</button>
    </div>`;
  }

  return `
  ${headerBar(true, false)}
  <div class="screen">
    <div style="margin-bottom:20px;"><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${progress}%"></div></div></div>
    <p style="font-size:15.5px;line-height:1.7;margin-bottom:16px;">${node.text}</p>
    <div class="panel" style="text-align:center;">
      <p class="small-note" style="margin-bottom:10px;">Lemparan dadu: <b style="color:var(--text);">${TRAIT_LABELS[dice.stat]||dice.stat} (${statVal})</b>${assistBonus>0?` <span style="color:var(--success);">+${assistBonus}</span>`:''} + 1d20, target <b style="color:var(--text);">${dice.target}</b></p>
      ${assistNote}
      <div class="dice-box"><div class="die" id="dieEl">${result ? result.roll : '?'}</div></div>
      ${!result ? `<button class="btn-primary" id="rollBtn" onclick="performDiceRoll(${assistBonus})">Lempar Dadu</button>` : `
        <p class="roll-result-text">Total: ${result.statValue}${result.assistBonus?` +${result.assistBonus}`:''} + ${result.roll} = ${result.total} (target ${result.target})</p>
        <p class="roll-outcome ${OUTCOME_LABEL[result.outcome].class}">${OUTCOME_LABEL[result.outcome].text}</p>
      `}
    </div>
    ${result ? `<button class="btn-primary" onclick="resolveDiceScenario()">Lanjut</button>` : ''}
  </div>`;
}

function performDiceRoll(assistBonus) {
  const node = getCurrentNode();
  const die = document.getElementById('dieEl');
  const btn = document.getElementById('rollBtn');
  if (btn) btn.disabled = true;
  die.classList.add('rolling');
  let ticks = 0;
  const anim = setInterval(() => {
    die.textContent = rollDice(20);
    ticks++;
    if (ticks > 12) {
      clearInterval(anim);
      pendingDiceResult = rollCheck(state.traits[node.dice.stat] || 50, node.dice.target, 20, assistBonus || 0);
      render();
    }
  }, 70);
}

function resolveDiceScenario() {
  const node = getCurrentNode();
  const result = pendingDiceResult;
  const outcome = node.outcomes[result.outcome === 'crit_lose' ? 'lose' : result.outcome];
  applyDelta(outcome.d, state.activeScenario.measures);
  pendingDiceResult = null;
  finishScenario();
}

    : `Kamu memilih berjalan sendiri. Bukan karena tidak butuh siapa pun — tapi karena kamu ingin tahu dulu siapa dirimu tanpa bayang-bayang orang lain.`;

function buildClosingPhilosophy(traits, derivedLabels, hardChoicesMade, companion) {
  const paragraphs = [];
  paragraphs.push(`Kalau ada satu hal yang bisa dikatakan dengan pasti tentang siapa dirimu setelah semua ini, itu bukan angka-angka pada lembar statusmu. Itu adalah pola — cara kamu, berulang kali, memilih ketika tidak ada yang benar-benar memaksamu untuk memilih dengan cara tertentu.`);

  if (hardChoicesMade.length > 0) {
    const chose_dark = hardChoicesMade.some(h => h.sacrificedHonor);
    if (chose_dark) {
      paragraphs.push(`Ada momen-momen ketika logika tampak begitu meyakinkan, begitu bersih, sampai kamu nyaris lupa bahwa nurani tidak pernah benar-benar terikat pada logika. Kamu bertindak, dan dunia tidak runtuh karenanya. Tapi sesuatu yang lebih pelan berubah — cara kamu tidur di malam hari, cara kamu mengingat wajah-wajah tertentu. Itu bukan hukuman dari luar. Itu adalah harga yang selalu ada, terlepas dari apakah siapa pun tahu.`);
    } else {
      paragraphs.push(`Ketika dihadapkan pada pilihan yang tidak punya jawaban bersih, kamu berulang kali memilih untuk mempertahankan sesuatu yang tidak bisa diukur dengan hasil akhir. Dunia tidak selalu menghargai itu. Tapi kamu tetap melakukannya — bukan karena itu mudah, tapi karena rasanya seperti satu-satunya cara kamu bisa terus mengenali dirimu sendiri di cermin.`);
    }
  }

  if (traits.ANX > 60) {
    paragraphs.push(`Kamu membawa lebih banyak beban di pikiranmu daripada yang pernah kamu tunjukkan pada orang lain. Itu bukan kelemahan — itu tanda bahwa kamu memperhatikan konsekuensi lebih dalam dari kebanyakan orang, meski kadang harganya adalah ketenangan yang tidak pernah benar-benar kamu miliki.`);
  } else if (traits.RES > 65) {
    paragraphs.push(`Entah bagaimana, hal-hal yang seharusnya menghancurkan orang lain hanya membentukmu ulang, sedikit demi sedikit, menjadi seseorang yang lebih sulit dipatahkan. Itu bukan berarti kamu tidak pernah terluka. Itu berarti kamu belajar bagaimana caranya terus berjalan sambil membawa lukanya.`);
  }

  if (companion) {
    paragraphs.push(`Dan sepanjang perjalanan ini, ada seseorang yang menyaksikan semuanya — bukan sebagai penonton, tapi sebagai orang yang ikut menanggung sebagian dari pilihan-pilihanmu. Kehadiran itu, lebih dari yang kamu sadari, ikut membentuk siapa kamu jadinya, dengan cara yang tidak pernah tercatat di lembar status manapun.`);
  }

  paragraphs.push(`Pada akhirnya, mungkin pertanyaan yang paling jujur bukan "apakah kamu orang baik". Pertanyaan yang lebih jujur adalah: ketika dunia tidak memberimu pilihan yang bersih, apa yang kamu pilih untuk korbankan — dan bisakah kamu hidup dengan pengorbanan itu? Kamu sudah menjawabnya. Berkali-kali. Dengan caramu sendiri.`);

  return paragraphs;
}

function renderEnding() {
  const classResult = computeClass(state.traits);
  const lifespan = computeLifespan(state.traits, !!state.companion);
  const goalProgress = computeGoalProgress(state.traits, state.goal.id);
  const outcomeTitle = computeOutcomeTitle(state.traits);
  const family = computeFamilyOutcome(state.traits, state.companion, state.bond, lifespan);
  const stage = state.companion ? bondStageFor(state.bond) : null;
  const hardChoicesMade = state.eventLog.filter(e => HARD_CHOICES.some(h => h.title === e.title));
  const closingPhilosophy = buildClosingPhilosophy(state.traits, state.derivedLabels, hardChoicesMade, state.companion);

  return `
  <div class="screen">
    <p style="font-size:11px;letter-spacing:2px;color:var(--accent);text-align:center;margin-bottom:4px;">KEHIDUPANMU</p>
    <p style="font-size:28px;text-align:center;margin-bottom:2px;">${lifespan}</p>
    <p class="small-note" style="text-align:center;margin-bottom:24px;">TAHUN</p>

    <div class="panel">
      ${rowHtml('Kelas', classResult.primary.name)}
      ${classResult.evolution ? rowHtml('→', classResult.evolution.name) : ''}
      ${rowHtml('Teman', state.companion ? `${state.nickname||state.companion.name} (${stage.label})` : 'Tidak ada')}
    </div>

    <div class="panel">
      <p class="panel-title">KEHIDUPAN PRIBADI</p>
      ${rowHtml('Status', family.partnered ? 'Menikah / Berpasangan' : 'Lajang')}
      ${family.partnered && family.partnerIsCompanion && state.companion ? rowHtml('Pasangan', state.nickname||state.companion.name) : ''}
      ${rowHtml('Anak', family.children)}
      ${family.grandchildren > 0 ? rowHtml('Cucu', family.grandchildren) : ''}
    </div>

    ${state.derivedLabels.length ? `
    <div class="panel">
      <p class="panel-title">SIAPA DIRIMU DI AKHIR</p>
      ${state.derivedLabels.map(l => `<p class="mid-note" style="margin-bottom:6px;"><b>${l.label}</b> — ${l.desc}</p>`).join('')}
    </div>` : ''}

    <div class="panel">
      <p class="panel-title">TUJUAN HIDUP</p>
      ${statRowHtml(state.goal.label, goalProgress)}
    </div>

    <div class="panel" style="text-align:center;">
      <p class="small-note" style="margin-bottom:8px;">AKHIR KEHIDUPAN</p>
      <p style="font-size:17px;font-style:italic;">${outcomeTitle.text}</p>
    </div>

    <div class="panel" style="background:rgba(10,8,18,0.65);">
      <p class="panel-title">PERENUNGAN TERAKHIR</p>
      ${closingPhilosophy.map(p => `<p class="mid-note" style="margin-bottom:14px;line-height:1.8;font-style:italic;">${p}</p>`).join('')}
    </div>

    <button class="btn-primary" onclick="resetGame()">Hidup Lagi</button>
  </div>`;
}

function rowHtml(label, value) {
  return `<div class="row-between"><span class="rk">${label}</span><span class="rv">${value}</span></div>`;
}

// ============================================================
// MAIN DISPATCHER
// ============================================================
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  let html = '';
  switch (state.screen) {
    case 'landing': html = renderLanding(); break;
    case 'settings': html = renderSettings(); break;
    case 'name-input': html = renderNameInput(); break;
    case 'death': html = renderDeath(); break;
    case 'goddess': html = renderGoddess(); break;
    case 'prayer-kind': html = renderPrayerKind(); break;
    case 'rolling': html = renderRolling(); break;
    case 'companion-reveal': html = renderCompanionReveal(); break;
    case 'nickname-picker': html = renderNicknamePicker(); break;
    case 'assessment-intro': html = renderAssessmentIntro(); break;
    case 'lifestage': html = renderLifestage(); break;
    case 'assessment': html = renderAssessment(); break;
    case 'hard-choice-intro': html = renderHardChoiceIntro(); break;
    case 'hard-choice-dice': html = renderHardChoiceDice(); break;
    case 'hard-choice-result': html = renderHardChoiceResult(); break;
    case 'hard-choice-aftermath': html = renderHardChoiceAftermath(); break;
    case 'character-sheet': html = renderCharacterSheet(); break;
    case 'narrative': html = renderNarrative(); break;
    case 'ending': html = renderEnding(); break;
    default: html = renderLanding();
  }
  app.innerHTML = html;
  if (state.screen === 'assessment') startTimerIfNeeded();
}

document.addEventListener('DOMContentLoaded', () => { render(); });

</script>
</body>
</html>
